name: 经济学人 Telegram 推送

on:
  schedule:
    # 北京时间每周六早上 9:07 和每周日早上 9:07 (UTC+8)
    # 经济学人通常周五/周六发布，双保险
    - cron: '7 1 * * 6'
    - cron: '7 1 * * 0'
  workflow_dispatch:  # 允许手动触发

concurrency:
  group: economist-monitor
  cancel-in-progress: false  # 防止定时和手动运行并发推送、覆盖状态

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要写入权限来更新 last_issue.txt

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行离线模拟测试
        run: python -m unittest discover -s tests -v

      - name: 运行监控脚本
        id: monitor
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python monitor.py

      - name: 提交状态更新
        # 即使后续期刊/合集失败，也保存此前已发送成功的检查点；任务仍显示失败。
        if: ${{ !cancelled() && steps.monitor.outcome != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for state in last_issue.txt catalog_msg_ids.txt source_state.txt; do
            if [ -f "$state" ]; then git add -- "$state"; fi
          done
          if git diff --staged --quiet; then
            echo "状态文件无变化"
          else
            git commit -m "update: last processed issue & catalog"
            git push
          fi
